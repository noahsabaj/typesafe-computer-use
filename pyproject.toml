[project]
name = "typesafe-computer-use"
version = "0.1.0"
description = "Cheap, fast computer use on macOS and Windows: deterministic screen state, a TypeSafe classifier for every decision, a writer model only for free text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Aaron Levin" }]
keywords = ["computer-use", "automation", "ocr", "typesafe", "macos", "windows", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anthropic==1.6.0",
    "pillow>=11",
    "typesafe-sdk==0.6.0",
    # macOS: Vision OCR, Quartz input, accessibility
    "ocrmac==1.0.1; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    # Windows: Windows.Media.Ocr, UI Automation, synthetic input
    "pynput==1.8.2; sys_platform == 'win32'",
    "uiautomation==2.0.29; sys_platform == 'win32'",
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Globalization==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/awlevin/typesafe-computer-use"
Issues = "https://github.com/awlevin/typesafe-computer-use/issues"

[project.scripts]
clicker = "typesafe_computer_use.cli:main"
clicker-inspect = "typesafe_computer_use.cli:inspect"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typesafe_computer_use"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
